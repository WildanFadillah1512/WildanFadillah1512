<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%" height="180">
  <defs>
    <style>
      .bg { fill: #F4F4F0; }
      .text-main { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: #111111; 
      }
      .line { stroke: #111111; stroke-width: 1; }
      .accent { fill: #E32636; }
      
      .header { font-size: 16px; font-weight: 800; letter-spacing: -0.5px; text-transform: uppercase; }
      .item { font-size: 14px; font-weight: 500; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <!-- Grid Lines -->
  <line x1="40" y1="0" x2="40" y2="180" class="line" />
  <line x1="0" y1="40" x2="800" y2="40" class="line" />
  <line x1="293" y1="40" x2="293" y2="180" class="line" />
  <line x1="546" y1="40" x2="546" y2="180" class="line" />

  <text x="50" y="25" class="text-main mono">01 // CORE_COMPETENCIES</text>

  <!-- Column 1: Frontend -->
  <rect x="50" y="60" width="8" height="8" class="accent" />
  <text x="68" y="68" class="text-main header">FRONTEND</text>
  <text x="50" y="95" class="text-main item">Vue.js / Nuxt</text>
  <text x="50" y="115" class="text-main item">React / Next.js</text>
  <text x="50" y="135" class="text-main item">TypeScript</text>
  <text x="50" y="155" class="text-main item">Tailwind CSS</text>

  <!-- Column 2: Backend -->
  <rect x="303" y="60" width="8" height="8" class="accent" />
  <text x="321" y="68" class="text-main header">BACKEND</text>
  <text x="303" y="95" class="text-main item">PHP / Laravel</text>
  <text x="303" y="115" class="text-main item">Node.js / Express</text>
  <text x="303" y="135" class="text-main item">PostgreSQL</text>
  <text x="303" y="155" class="text-main item">Redis / Queue</text>

  <!-- Column 3: Infrastructure -->
  <rect x="556" y="60" width="8" height="8" class="accent" />
  <text x="574" y="68" class="text-main header">INFRASTRUCTURE</text>
  <text x="556" y="95" class="text-main item">Docker / Containers</text>
  <text x="556" y="115" class="text-main item">CI/CD Pipelines</text>
  <text x="556" y="135" class="text-main item">Linux Administration</text>
  <text x="556" y="155" class="text-main item">Microservices</text>

</svg>
