<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="300">
  <defs>
    <style>
      .bg { fill: #F4F4F0; }
      .text-main { 
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        fill: #111111; 
      }
      .line { stroke: #111111; stroke-width: 1; }
      .accent { fill: #E32636; }
      
      .huge { font-size: 64px; font-weight: 900; letter-spacing: -2px; }
      .medium { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
      .small { font-size: 14px; font-weight: 500; letter-spacing: 0.5px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 12px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" />
  
  <!-- Grid Lines -->
  <line x1="40" y1="0" x2="40" y2="300" class="line" />
  <line x1="0" y1="40" x2="800" y2="40" class="line" />
  <line x1="0" y1="260" x2="800" y2="260" class="line" />

  <!-- Coordinates / Metadata (Top Left) -->
  <text x="50" y="25" class="text-main mono">ARCH_ID: 1512</text>
  <text x="750" y="25" class="text-main mono" text-anchor="end">SYS.VER: 1.0.4</text>

  <!-- Main Content -->
  <text x="50" y="110" class="text-main huge">WILDAN</text>
  <text x="50" y="175" class="text-main huge">FADILLAH.</text>

  <rect x="50" y="210" width="12" height="12" class="accent" />
  <text x="75" y="222" class="text-main medium">ENTERPRISE SYSTEMS ARCHITECT</text>
  
  <text x="50" y="245" class="text-main small">FULL-STACK ENGINEER / COMPLEX DASHBOARDS / MONITORING SYSTEMS</text>

  <!-- Abstract Graphic (Right side) -->
  <circle cx="700" cy="150" r="60" fill="none" class="line" />
  <circle cx="700" cy="150" r="40" fill="none" class="line" />
  <circle cx="700" cy="150" r="4" class="accent" />
  <line x1="640" y1="150" x2="760" y2="150" class="line" />
  <line x1="700" y1="90" x2="700" y2="210" class="line" />
</svg>
