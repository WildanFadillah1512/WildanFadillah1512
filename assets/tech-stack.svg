<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="220">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');
      
      .bg { fill: #0D1117; }
      .box { 
        fill: rgba(255,255,255,0.02); 
        stroke: rgba(255,255,255,0.05); 
        stroke-width: 1; 
      }
      
      .title { 
        font-family: 'Fira Code', monospace; 
        font-size: 14px; 
        fill: #8B949E; 
        font-weight: 700; 
      }
      
      .icon-text { 
        font-family: 'Fira Code', monospace; 
        font-size: 13px; 
        fill: #C9D1D9; 
      }
      
      .dot {
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
      }
    </style>
  </defs>
  
  <rect width="100%" height="100%" class="bg" rx="12" />
  
  <text x="30" y="40" class="title">&gt; cat ~/skills_and_tools.json</text>

  <!-- Frontend Box -->
  <rect x="30" y="60" width="220" height="130" class="box" rx="8" />
  <circle cx="50" cy="81" r="4" fill="#00F0FF" class="dot" />
  <text x="65" y="85" class="title" style="fill: #00F0FF; font-size: 12px;">FRONTEND_LAYER</text>
  
  <g transform="translate(50, 115)">
    <text x="0" y="0" class="icon-text">- Vue.js</text>
    <text x="0" y="25" class="icon-text">- React / Next.js</text>
    <text x="0" y="50" class="icon-text">- TypeScript</text>
  </g>

  <!-- Backend Box -->
  <rect x="270" y="60" width="220" height="130" class="box" rx="8" />
  <circle cx="290" cy="81" r="4" fill="#B14BF4" class="dot" style="animation-delay: 0.5s;" />
  <text x="305" y="85" class="title" style="fill: #B14BF4; font-size: 12px;">BACKEND_INFRA</text>
  
  <g transform="translate(290, 115)">
    <text x="0" y="0" class="icon-text">- PHP / Laravel</text>
    <text x="0" y="25" class="icon-text">- Node.js</text>
    <text x="0" y="50" class="icon-text">- PostgreSQL / MySQL</text>
  </g>

  <!-- Tools Box -->
  <rect x="510" y="60" width="260" height="130" class="box" rx="8" />
  <circle cx="530" cy="81" r="4" fill="#FF7B72" class="dot" style="animation-delay: 1s;" />
  <text x="545" y="85" class="title" style="fill: #FF7B72; font-size: 12px;">OPS_&amp;_ARCHITECTURE</text>
  
  <g transform="translate(530, 115)">
    <text x="0" y="0" class="icon-text">- Git / CI/CD</text>
    <text x="0" y="25" class="icon-text">- Docker / Linux</text>
    <text x="0" y="50" class="icon-text">- Microservices / REST APIs</text>
  </g>

</svg>
