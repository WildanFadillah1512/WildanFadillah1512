<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="250">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;display=swap');
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');

      .bg { fill: #0D1117; }
      .grid { stroke: rgba(0, 240, 255, 0.05); stroke-width: 1; }
      
      .title {
        font-family: 'Inter', sans-serif;
        font-weight: 900;
        font-size: 42px;
        fill: #FFFFFF;
        animation: glow 3s ease-in-out infinite alternate;
      }
      
      .subtitle {
        font-family: 'Inter', sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #8B949E;
      }
      
      .highlight {
        fill: #00F0FF;
      }

      .purple {
        fill: #B14BF4;
      }
      
      .code {
        font-family: 'Fira Code', monospace;
        font-size: 14px;
        fill: #B14BF4;
      }
      
      @keyframes glow {
        0% { text-shadow: 0 0 10px rgba(0,240,255,0.2); }
        100% { text-shadow: 0 0 20px rgba(0,240,255,0.6), 0 0 30px rgba(0,240,255,0.4); }
      }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }
      
      .box {
        animation: float 4s ease-in-out infinite;
      }
      
      @keyframes pulse {
        0% { opacity: 1; }
        50% { opacity: 0.3; }
        100% { opacity: 1; }
      }
      
      .cursor {
        animation: pulse 1s infinite;
      }
    </style>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" class="grid"/>
    </pattern>
    
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#B14BF4" />
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="12" />
  
  <!-- Grid -->
  <rect width="100%" height="100%" fill="url(#grid)" />
  
  <!-- Accent Top Line -->
  <rect x="0" y="0" width="100%" height="4" fill="url(#grad)" />

  <!-- Content -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" class="code">&gt; system.initialize()</text>
    <text x="0" y="20" class="code">... loading user profile <tspan class="cursor">_</tspan></text>
    
    <text x="0" y="70" class="title">WILDAN FADILLAH</text>
    
    <text x="0" y="105" class="subtitle">
      <tspan class="highlight">SOFTWARE ENGINEER</tspan> • FULL-STACK DEVELOPER • <tspan class="purple">MODERN WEB ARCHITECT</tspan>
    </text>
    
    <text x="0" y="135" class="code" style="fill: #8B949E;">
      [ 🟢 <tspan class="highlight">STATUS: ONLINE</tspan> ] Specializing in Enterprise-Grade Dashboards
    </text>
  </g>

  <!-- Decorative UI Elements -->
  <g class="box" transform="translate(600, 50)">
    <rect x="0" y="0" width="120" height="120" fill="none" stroke="rgba(0,240,255,0.2)" stroke-width="2" rx="8" />
    <!-- Chart Line -->
    <path d="M 20 80 L 40 50 L 60 70 L 80 30 L 100 40" fill="none" stroke="#B14BF4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="20" cy="80" r="4" fill="#00F0FF" filter="url(#blur)" />
    <circle cx="40" cy="50" r="4" fill="#00F0FF" filter="url(#blur)" />
    <circle cx="60" cy="70" r="4" fill="#00F0FF" filter="url(#blur)" />
    <circle cx="80" cy="30" r="4" fill="#00F0FF" filter="url(#blur)" />
    <circle cx="100" cy="40" r="4" fill="#00F0FF" filter="url(#blur)" />
    <text x="60" y="105" class="code" style="font-size: 10px; fill: #00F0FF; text-anchor: middle;">SYSTEM_HEALTH</text>
  </g>
  
</svg>
